<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удачи в Китае</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #17212b; /* Темный фон как в Telegram */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 90%;
        }
        img {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.4;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Убедись, что картинка start.jpg лежит в той же папке -->
        <img src="start.jpg" alt="Картинка">
        <h1>Удачи тебе в Китае,<br>хорошего полёта,<br>мягкой посадки.</h1>
    </div>
</body>
</html>
